# Generated by sitemills-cli-internal/scripts/release-public.mjs. Do not edit by hand.
#
# Publishes the npm package attached to a published vX.Y.Z release. The release tool dispatches
# this on the tag after the smoke test passes and the release is live. Authentication is npm
# trusted publishing (OIDC): no npm token exists anywhere, and npm records provenance showing
# the package was published by this workflow.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm version that supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Download the package from the release
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "sitemills-cli-${TAG#v}.tgz" -p SHA256SUMS -D pkg

      - name: Verify checksum
        working-directory: pkg
        run: grep " sitemills-cli-${TAG#v}.tgz\$" SHA256SUMS | sha256sum -c -

      - name: Publish
        run: npm publish "pkg/sitemills-cli-${TAG#v}.tgz" --access public --provenance
