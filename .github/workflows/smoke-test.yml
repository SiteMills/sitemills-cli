# Generated by sitemills-cli-internal/scripts/release-public.mjs. Do not edit by hand.
#
# The release tool pushes a vX.Y.Z tag, uploads the binaries to a DRAFT release, dispatches
# this workflow on the tag, and waits for it. The release is only published (and the version
# manifest on main only bumped) if every binary passes on a real machine of its platform.
name: Smoke-test release binaries

on:
  workflow_dispatch:

permissions:
  contents: write # reading draft release assets requires write access

jobs:
  smoke:
    name: ${{ matrix.asset }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: sitemills-linux, platform: linux-x64 }
          - { os: macos-15-intel, asset: sitemills-macos, platform: darwin-x64 }
          - { os: macos-15, asset: sitemills-macos-arm64, platform: darwin-arm64 }
          - { os: windows-latest, asset: sitemills-win.exe, platform: win32-x64 }
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      ASSET: ${{ matrix.asset }}
      SITEMILLS_NO_UPDATE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Wait for the draft release assets
        run: |
          for i in $(seq 1 60); do
            if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -p SHA256SUMS -D rel --clobber 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Assets for $TAG did not appear on the release within 10 minutes"
          exit 1

      - name: Verify checksum
        working-directory: rel
        run: |
          expected=$(grep " $ASSET\$" SHA256SUMS | cut -d' ' -f1)
          if command -v sha256sum >/dev/null; then actual=$(sha256sum "$ASSET" | cut -d' ' -f1); else actual=$(shasum -a 256 "$ASSET" | cut -d' ' -f1); fi
          echo "expected=$expected actual=$actual"
          test -n "$expected" && test "$expected" = "$actual"

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --strict --verbose=2 "rel/$ASSET"

      - name: Run the binary
        run: |
          chmod +x "rel/$ASSET"
          out=$("./rel/$ASSET" version --no-update)
          echo "$out"
          echo "$out" | grep -F "sitemills-cli v${TAG#v} (${{ matrix.platform }}, binary)"
          "./rel/$ASSET" help push | grep -F "Usage: sitemills-cli push"
          "./rel/$ASSET" help check | grep -F "Usage: sitemills-cli check"
